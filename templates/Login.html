{% extends 'base.html' %}
{% block content%}

<h3> Logging in</h3>

<section class="signform"> 
     <!-- This is a form is for people to log into a session or into their account.
      This follow the same principal as the sign up form.-->
    <form action="Login" method="POST">
        <div class = "Input">
            <label for= "username"> Username</label>
            <input type="text" name = "username" id="username" placeholder="enter here" required></input>

            <label for= "password"> Password</label>
            <input type="text" name = "password" id="password" placeholder="enter here" required></input>

        </div>

        <button type="submit" class="button">Log in!</button>
    </form>
    
    <div class="action">
        <p> Do YOU don't have an account? <a href="signup">Sign up now!</a>
         Or did you forget your password?<a href="/help"> Click this!</a></p>
         <!-- 'href' is linking to another part of the website or from another website. In this case, the
          link will take you to the sign up page or the help page.-->
    </div>

</section>

{% endblock %}
