{% extends 'base.html' %}
{% block content%}

<h3> Logging in</h3>

<section class="signform"> 
    <form action="Login" method="POST">
        <div class = "Input">
            <label for= "Username"> Username</label>
            <input type="text" name = "Username" id="Username" placeholder="enter here" required></input>

            <label for= "Password"> Password</label>
            <input type="text" name = "Password" id="Password" placeholder="enter here" required></input>

        </div>

        <button type="submit" class="button">Log in!</button>
    </form>
    
    <div class="action">
        <p> Do YOU don't have an account? <a href="signup">Sign up now!</a>
         Or did you forget your password?<a href="/help"> Click this!</a>
        </p>
    </div>

</section>

{% endblock %}
