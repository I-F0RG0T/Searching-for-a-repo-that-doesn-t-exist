<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename= 'style.css') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rewies and games!!</title>
</head>

<!-- This is the layout of each page.-->

<body>
    {% include 'nav.html' %}
    <!-- this links thte nav page to the other pages. 
     This makes it that it will be shown in each pages that is connect to this page.-->

    <!-- This is the flashed messages. It will show if the python code have a flashed messages..-->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
                <!-- This is the message.-->
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}
    {% endblock %}
    <!-- this is where the end of the layout ends.-->
</body>

</html>
