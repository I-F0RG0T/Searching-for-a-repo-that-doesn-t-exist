{% extends 'base.html' %}
{% block content%}

<p> hi hi hi - spoke</p>

<section class="Game-Register">
    <h1>Put a Game on here!</h1>

    <p> Do you have a game that we dont have here? <br>
    Here you can put any game on our website for all to see!!</p>

        <form action="/make_Game" method="POST" enctype="multipart/form-data">

        <!-- Name of game-->
        <label for="Title">Title</label>
        <input type="text" id="Title" name="Title" placeholder="hai" required>

        <!-- About-->
        <label for="About">About the game!</label>
        <input type="text" id="About" name="About" placeholder="test">

        <!-- Genre, probaly fix it. IS not showing the genre xd-->
        <label for="type_Genre">type_Genre</label>
        <select id="type_Genre" name="type_Genre" required>
            <option value="" selected disabled>select a genre!</option>
            
            {% for type_Genre in type_Genre %}
                <option value="{{ type_Genre[1] }}">
                    {{ type_Genre[1] }}
                </option>
            {% endfor %}
        </select>

        <label for="webiste_url"> Website </label>
        <input type="url" id="website_url" name="website_url" placeholder="name stuff wesbite" required>

        <label for="file"> Image of Game</label>
        <input type="file" id ="file" name="file" accept="image/*">

        <button type="submit">Button</button>

        </form>
</select>

{% endblock %}
