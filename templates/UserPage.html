{% extends 'base.html' %}
{% block content%}
<section class="UserBox">
    <p> All users who have made an account with us! </p>

    <!-- This connects to pyhton by using flask. It check what it is give in from Python and show it.-->
    {% for User in results %}
    <section>
        <li class="USERLIST">  
            {% if User[3] %}<!-- This grabs from the images from the User table from SQL-->
                <img src="{{ url_for('static', filename='UPLOAD/PFP/' + User[3]) }}" alt="PFP" width="100" height="100"> 
                <!-- If the User have a images in the database. It will show this.-->
            
                {% else %}
                <img src="{{ url_for('static', filename='default.jpg' ) }}" alt="PFP"> <!-- If the User dont have a images in the database. It will show this.-->

            {% endif %}
            <a href="User/{{User[0]}}" class="USERLIST">{{ User[1] }}</a> <!-- Grabs the username from the User table. -->
        </li>
    </section>
    {% endfor %}
</section>

<!-- the 'User[0]' is what column it is taking it from. Since code start at the number 0, it will look at 0 and onwards.-->

{% endblock %}
